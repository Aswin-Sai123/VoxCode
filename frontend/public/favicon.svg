<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#080B11"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background rounded badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="url(#strokeGrad)" stroke-width="2"/>

  <!-- VC Monogram Text -->
  <text 
    x="31" 
    y="41" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
    font-size="28" 
    font-weight="900" 
    letter-spacing="-1.2" 
    fill="url(#textGrad)"
  >VC</text>

  <!-- Studio accent live indicator dot -->
  <circle cx="50" cy="22" r="3.2" fill="#38BDF8"/>
</svg>